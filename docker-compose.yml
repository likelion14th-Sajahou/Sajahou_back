services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sajarok
      MYSQL_USER: sajarok
      MYSQL_PASSWORD: sajarok
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
