spring:
  config:
    import: "optional:file:./.env[.properties]"
  application:
    name: sajarok
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sajarok?serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:sajarok}
    password: ${DB_PASSWORD:sajarok}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

auth:
  google:
    client-id: "${GOOGLE_CLIENT_ID:}"
  demo:
    enabled: ${APP_AUTH_DEMO_ENABLED:true}

attachment:
  storage:
    bucket: ${ATTACHMENT_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}