name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Upload jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain | head -n 1)
          scp -i ~/.ssh/deploy.pem "$JAR" ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/app/sajarok.jar.new

      - name: Restart and health check
        run: |
          ssh -i ~/.ssh/deploy.pem ubuntu@${{ secrets.EC2_HOST }} '
            mv /home/ubuntu/app/sajarok.jar.new /home/ubuntu/app/sajarok.jar &&
            sudo systemctl restart sajarok &&
            for i in $(seq 1 40); do
              if curl -sf http://127.0.0.1:8080/api/v1/auth/csrf > /dev/null; then echo "서버 시작 완료"; exit 0; fi
              sleep 3
            done
            echo "서버가 120초 안에 뜨지 않았어요. 최근 로그:"
            sudo journalctl -u sajarok -n 80 --no-pager
            exit 1
          '
